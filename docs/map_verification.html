<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bavdhan Van Udyan - Geographical Foundation Verification</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 85vh; width: 100%; }
        .header { background-color: #1b4332; color: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .header h1 { margin: 0; font-size: 20px; }
        .header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.9; }
        .legend { background: white; padding: 12px 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.2); font-size: 13px; line-height: 1.8; }
        .legend-color { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: middle; border-radius: 3px; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌳 Bavdhan Van Udyan — Geographical Foundation Verification (Phase 1)</h1>
        <p>Location: Plus Code GQ9J+74Q | Address: Lantana Gardens, Bavdhan, Pune, Maharashtra 411021</p>
    </div>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([18.5188, 73.7800], 17);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors | RSWF NGO'
        }).addTo(map);

        const boundaryData = {"type": "FeatureCollection", "name": "Bavdhan_Van_Udyan_Boundary", "crs": {"type": "name", "properties": {"name": "urn:ogc:def:crs:OGC:1.3:CRS84"}}, "features": [{"type": "Feature", "properties": {"name": "VAN UDHYAN", "site_name": "Bavdhan Van Udyan", "plus_code": "GQ9J+74Q", "address": "Lantana Gardens, Bavdhan, Pune, Maharashtra 411021", "crs": "EPSG:4326", "type": "complete_boundary", "description": "Complete geographical boundary of Bavdhan Van Udyan project area"}, "geometry": {"type": "Polygon", "coordinates": [[[73.780154, 18.5179986], [73.7809286, 18.5179152], [73.7813422, 18.5179681], [73.7810273, 18.5185775], [73.780178, 18.5199608], [73.7797949, 18.5200349], [73.7790106, 18.5201137], [73.778825, 18.5197132], [73.7788931, 18.5194341], [73.7789881, 18.5191727], [73.7791256, 18.5190175], [73.780154, 18.5179986]]]}}]};
        const zonesData = {"type": "FeatureCollection", "name": "Bavdhan_Van_Udyan_Active_Zones", "crs": {"type": "name", "properties": {"name": "urn:ogc:def:crs:OGC:1.3:CRS84"}}, "features": [{"type": "Feature", "properties": {"name": "ZONE A", "site_name": "Bavdhan Van Udyan", "plus_code": "GQ9J+74Q", "address": "Lantana Gardens, Bavdhan, Pune, Maharashtra 411021", "crs": "EPSG:4326", "type": "active_monitoring_zone", "status": "active", "description": "Current RSWF active intervention/monitoring work zone ZONE A"}, "geometry": {"type": "Polygon", "coordinates": [[[73.7806449, 18.5185488], [73.7804188, 18.5188288], [73.7802157, 18.5187631], [73.7800515, 18.5186325], [73.7801884, 18.5184504], [73.7802957, 18.5182848], [73.7806449, 18.5185488]]]}}, {"type": "Feature", "properties": {"name": "ZONE B", "site_name": "Bavdhan Van Udyan", "plus_code": "GQ9J+74Q", "address": "Lantana Gardens, Bavdhan, Pune, Maharashtra 411021", "crs": "EPSG:4326", "type": "active_monitoring_zone", "status": "active", "description": "Current RSWF active intervention/monitoring work zone ZONE B"}, "geometry": {"type": "Polygon", "coordinates": [[[73.7803587, 18.5189196], [73.7802565, 18.5190526], [73.7798861, 18.5188052], [73.7799585, 18.5187159], [73.7800376, 18.5186483], [73.7802257, 18.518796], [73.7803988, 18.5188495], [73.7803587, 18.5189196]]]}}, {"type": "Feature", "properties": {"name": "ZONE C", "site_name": "Bavdhan Van Udyan", "plus_code": "GQ9J+74Q", "address": "Lantana Gardens, Bavdhan, Pune, Maharashtra 411021", "crs": "EPSG:4326", "type": "active_monitoring_zone", "status": "active", "description": "Current RSWF active intervention/monitoring work zone ZONE C"}, "geometry": {"type": "Polygon", "coordinates": [[[73.7798735, 18.5188197], [73.7802131, 18.519047], [73.78026, 18.5190722], [73.7801782, 18.5191864], [73.7800924, 18.519308], [73.7800217, 18.5193754], [73.7799592, 18.5194556], [73.7798367, 18.5195956], [73.7797595, 18.5192373], [73.7797866, 18.5189799], [73.7797826, 18.5189102], [73.7798214, 18.5188545], [73.7798735, 18.5188197]]]}}]};

        // Render Van Udyan Boundary
        const boundaryLayer = L.geoJSON(boundaryData, {
            style: {
                color: '#d90429',
                weight: 3,
                opacity: 0.9,
                fillColor: '#ef233c',
                fillOpacity: 0.15,
                dashArray: '5, 5'
            },
            onEachFeature: function(feature, layer) {
                layer.bindPopup('<b>' + feature.properties.name + '</b><br>Complete Project Area Boundary<br>CRS: EPSG:4326');
            }
        }).addTo(map);

        const zoneColors = {
            'ZONE A': '#0077b6',
            'ZONE B': '#2a9d8f',
            'ZONE C': '#e76f51'
        };

        // Render Active Zones
        const zonesLayer = L.geoJSON(zonesData, {
            style: function(feature) {
                const name = feature.properties.name;
                const color = zoneColors[name] || '#9b5de5';
                return {
                    color: color,
                    weight: 2.5,
                    opacity: 1.0,
                    fillColor: color,
                    fillOpacity: 0.45
                };
            },
            onEachFeature: function(feature, layer) {
                layer.bindPopup('<b>' + feature.properties.name + '</b><br>Active RSWF Working Zone<br>Status: ' + feature.properties.status);
            }
        }).addTo(map);

        map.fitBounds(boundaryLayer.getBounds());

        // Legend
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function(map) {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<b>Layer Legend</b><br>' +
                '<div><span class="legend-color" style="background: #ef233c; border-style: dashed;"></span> Full Van Udyan Boundary</div>' +
                '<div><span class="legend-color" style="background: #0077b6;"></span> Zone A (Active)</div>' +
                '<div><span class="legend-color" style="background: #2a9d8f;"></span> Zone B (Active)</div>' +
                '<div><span class="legend-color" style="background: #e76f51;"></span> Zone C (Active)</div>';
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
